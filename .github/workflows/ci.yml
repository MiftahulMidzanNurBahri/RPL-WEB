name: CI

on:
  pull_request:
    branches: [main, "v1.0_dev", "v1.1"]
  push:
    branches: [main, "v1.0_dev", "v1.1", "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres.gjcfexztebhcyulixzfq:dua8259623.@aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres
      SESSION_SECRET: ba30d5353fed9a98e65f0b7ad72a889166df5a5fcf78138187777e2a1be24a30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run build
