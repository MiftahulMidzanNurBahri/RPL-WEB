name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../../../data/lost-and-found.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run build
